<!doctype html>
<html lang="fr" data-view="detail">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quota Claude</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --green: #3fb950;
    --yellow: #d29922;
    --orange: #db6d28;
    --red: #f85149;
    --dark: #6e40c9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    padding: 24px 16px 48px;
  }
  .wrap { max-width: 680px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 16px;
  }
  .row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .label { font-size: 14px; color: var(--muted); }
  .pct { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .bar-track {
    height: 8px;
    background: #21262d;
    border-radius: 999px;
    overflow: hidden;
  }
  .bar-fill { height: 100%; border-radius: 999px; transition: width .4s ease, background-color .4s ease; }
  .meta { display: flex; justify-content: space-between; margin-top: 6px; font-size: 12px; color: var(--muted); }
  .pace { font-variant-numeric: tabular-nums; }
  .top-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .chip {
    display: inline-block;
    font-size: 13px;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--muted);
  }
  #status {
    font-size: 12px;
    color: var(--muted);
    margin-top: 24px;
    text-align: center;
  }
  #status.stale { color: var(--red); }
</style>
<script src="/common.js"></script>
</head>
<body>
  <div class="wrap">
    <h1>Quota Claude</h1>
    <div class="sub">Données lues depuis <code>data/quota-status.json</code>, générées par la statusline de Claude Code.</div>

    <div class="top-row">
      <span class="chip" id="model-chip">Modèle : —</span>
      <span class="chip" id="ctx-chip">Contexte : —</span>
    </div>

    <div id="windows"></div>

    <div id="status">En attente de données…</div>
  </div>

<script>
const COLORS = { green: "#3fb950", yellow: "#d29922", orange: "#db6d28", red: "#f85149", dark: "#6e40c9" };

function levelColor(p, pace) {
  let col = p < 50 ? "green" : p < 75 ? "yellow" : p < 90 ? "orange" : "red";
  if (pace !== null && pace !== undefined && p >= 5) {
    const rank = { green: 0, yellow: 1, orange: 2, red: 3 };
    const pc = pace < 0.8 ? "green" : pace < 1.1 ? "yellow" : pace < 1.5 ? "orange" : "red";
    if (rank[pc] > rank[col]) col = pc;
  }
  if (p >= 100) col = "dark";
  return COLORS[col];
}

function fmtDate(ts) {
  if (!ts) return null;
  const d = new Date(ts * 1000);
  return d.toLocaleString("fr-FR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
}

function render(data) {
  const chip = document.getElementById("model-chip");
  chip.textContent = "Modèle : ";
  const mspan = document.createElement("span");
  mspan.textContent = data.model || "—";
  mspan.style.color = modelColor(data.model, true);
  chip.append(mspan);
  const ctx = data.context_used_percentage;
  document.getElementById("ctx-chip").textContent = "Contexte : " + (ctx !== undefined && ctx !== null ? Math.round(ctx) + "%" : "—");

  const order = [["five_hour", "Fenêtre 5 heures"], ["seven_day", "Fenêtre 7 jours"]];
  const container = document.getElementById("windows");
  container.innerHTML = "";

  for (const [key, title] of order) {
    const w = (data.windows || {})[key];
    if (!w) continue;
    const p = w.used_percentage;
    const color = levelColor(p, w.pace);
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="row">
        <span class="label">${title}</span>
        <span class="pct" style="color:${color}">${Math.round(p)}%</span>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.min(p,100)}%; background:${color}"></div></div>
      <div class="meta">
        <span class="pace">${w.pace !== null && w.pace !== undefined ? "rythme x" + w.pace.toFixed(2) : ""}</span>
        <span>${w.resets_at ? "reset " + fmtDate(w.resets_at) : ""}</span>
      </div>
    `;
    container.appendChild(card);
  }
}

async function poll() {
  const statusEl = document.getElementById("status");
  try {
    const res = await fetch("/quota.json?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    render(data);
    const age = Date.now() / 1000 - data.updated_at;
    if (age > 120) {
      statusEl.textContent = "Dernière donnée il y a " + Math.round(age / 60) + " min — Claude Code semble inactif";
      statusEl.classList.add("stale");
    } else {
      statusEl.textContent = "Mis à jour il y a " + Math.round(age) + " s";
      statusEl.classList.remove("stale");
    }
  } catch (e) {
    statusEl.textContent = "Pas encore de données (lance une session Claude Code pour générer le fichier)";
    statusEl.classList.add("stale");
  }
}

poll();
setInterval(poll, 3000);
</script>
</body>
</html>
