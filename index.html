<!doctype html>
<html lang="fr" data-view="compact"><head><meta charset="utf-8"><title>Quota Claude</title>
<style>
:root{--bg:#1b1b1f;--fg:#e8e8ec;--mut:#8a8a94;--bar:#2c2c33}
@media (prefers-color-scheme:light){:root{--bg:#fafafa;--fg:#222;--mut:#777;--bar:#e3e3e8}}
body{margin:0;padding:14px 16px;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif}
.row{margin-bottom:12px}.top{display:flex;justify-content:space-between;margin-bottom:4px}
.bar{height:10px;background:var(--bar);border-radius:5px;overflow:hidden}.fill{height:100%}
.mut{color:var(--mut);font-size:12px}
</style><script src="/common.js"></script>
</head><body>
<div id="app" class="mut">Chargement…</div>
<script>
const COLORS={green:"#3fb950",yellow:"#d29922",orange:"#db6d28",red:"#f85149",dark:"#6e40c9"};
// meme regle que detail.html : le pire du pourcentage et du rythme, violet a 100 %
function levelColor(p,pace){
  let c=p<50?"green":p<75?"yellow":p<90?"orange":"red";
  if(pace!=null&&p>=5){const r={green:0,yellow:1,orange:2,red:3};
    const pc=pace<0.8?"green":pace<1.1?"yellow":pace<1.5?"orange":"red";if(r[pc]>r[c])c=pc;}
  if(p>=100)c="dark";
  return COLORS[c];
}
const fmt=t=>new Date(t*1000).toLocaleString("fr-FR",{weekday:"short",hour:"2-digit",minute:"2-digit"});
async function tick(){
  let d={};try{d=await (await fetch("/quota.json")).json()}catch(e){}
  const a=document.getElementById("app");
  if(!d.updated_at){a.textContent="Pas de données (lancez Claude Code).";return}
  let h="";
  for(const w of Object.values(d.windows||{})){
    const p=Math.round(w.used_percentage);
    h+=`<div class=row><div class=top><b>${w.label}</b><span style="color:${levelColor(w.used_percentage,w.pace)};font-weight:600">${p}%</span><span class=mut>${w.pace!=null?`rythme x${w.pace.toFixed(2)}`:""}</span></div>
    <div class=bar><div class=fill style="width:${Math.min(p,100)}%;background:${levelColor(w.used_percentage,w.pace)}"></div></div>
    <div class=mut>reset ${w.resets_at?fmt(w.resets_at):"?"}</div></div>`;
  }
  const age=Math.round((Date.now()/1000-d.updated_at)/60);
  h+=`<div class=mut><span style="color:${modelColor(d.model)}">${d.model||""}</span>${d.context_used_percentage!=null?` · ctx <span style="color:${ctxColor(d.context_used_percentage)}">${Math.round(d.context_used_percentage)}%</span>`:""} · maj il y a ${age} min</div>`;
  a.innerHTML=h;
}
tick();setInterval(tick,5000);
</script></body></html>
